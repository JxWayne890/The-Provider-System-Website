  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": ["Organization", "ProfessionalService"],
        "@id": "https://theprovidersystem.com/#organization",

        },
        "knowsAbout": [
          "Blue-Collar Websites", "Contractor Websites", "Lead Capture Systems",
          "CRM Workflows", "Automated Follow-Up", "Booking Systems",
          "Custom Operating Systems", "Service Business Websites"
        ],

      {
        "@type": "WebSite",
        "@id": "https://theprovidersystem.com/#website",
        "url": "https://theprovidersystem.com",
        "name": "The Provider System",
        "publisher": { "@id": "https://theprovidersystem.com/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://theprovidersystem.com/?s={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does The Provider System do?",
            "acceptedAnswer": { "@type": "Answer", "text": "The Provider System builds websites, lead CRMs, follow-up systems, and custom operating tools for blue-collar businesses and selected operators." }
          },
          {
            "@type": "Question",
            "name": "What types of businesses do you work with?",
            "acceptedAnswer": { "@type": "Answer", "text": "We primarily work with blue-collar and local service businesses, including contractors, trades, and home service companies. We also take selected custom app builds when the system is operationally meaningful." }
          },
          {
            "@type": "Question",
            "name": "How much does a Provider System project cost?",
            "acceptedAnswer": { "@type": "Answer", "text": "Website foundations typically start at $2,500 or managed monthly plans from $299/month. Lead and CRM systems usually start at $6,500 or managed monthly plans from $750/month. Custom operating systems are quoted after an audit." }
          },
          {
            "@type": "Question",
            "name": "Do clients own their website or system?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes. The Provider System builds with ownership in mind, including clear handoff, access, and setup details appropriate to the project." }
          },
          {
            "@type": "Question",
            "name": "Do I need technical knowledge to use your systems?",
            "acceptedAnswer": { "@type": "Answer", "text": "No. All systems are designed for non-technical operators with clean interfaces, documentation, and ongoing support included." }
          }
        ]
      }
    ]
  }
